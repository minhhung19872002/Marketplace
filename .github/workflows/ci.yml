# ShopHub CI (Phase 14 C1): backend build + tests (Testcontainers), the three frontends (tsc + vitest), and the
# Playwright suite against the full Docker stack. Runs on every push and pull request.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build -warnaserror, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (warnings are errors)
        working-directory: backend
        run: dotnet build ShopHub.sln -c Release -warnaserror
      - name: Tests (unit + integration on Testcontainers)
        working-directory: backend
        run: dotnet test ShopHub.sln -c Release --no-build --logger "trx;LogFilePrefix=results" --results-directory TestResults
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/TestResults

  frontend:
    name: Frontend ${{ matrix.app }} (tsc, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [web, seller, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.app }}
      - run: npx tsc -b
        working-directory: ${{ matrix.app }}
      - run: npx vitest run
        working-directory: ${{ matrix.app }}

  e2e:
    name: End-to-end (Playwright on the Docker stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 60
    env:
      SH_E2E_BASE_URL: http://localhost:18000
      # Scenarios that need the platform admin read it from the repository secrets; without them they report "skipped"
      SH_E2E_ADMIN_USER: ${{ secrets.SH_E2E_ADMIN_USER }}
      SH_E2E_ADMIN_PASSWORD: ${{ secrets.SH_E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Environment file with fresh secrets
        run: |
          cp .env.example .env
          sed -i "s|^SH_DB_PASSWORD=.*|SH_DB_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^SH_MINIO_SECRET_KEY=.*|SH_MINIO_SECRET_KEY=$(openssl rand -hex 16)|" .env
          sed -i "s|^SH_MEILI_MASTER_KEY=.*|SH_MEILI_MASTER_KEY=$(openssl rand -hex 24)|" .env
          sed -i "s|^SH_JWT_SECRET=.*|SH_JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^SH_DATA_KEY=.*|SH_DATA_KEY=$(openssl rand -base64 32)|" .env
          if [ -n "$SH_E2E_ADMIN_PASSWORD" ]; then
            echo "SH_SEED_ADMIN_PASSWORD=$SH_E2E_ADMIN_PASSWORD" >> .env
          else
            echo "::warning title=E2E admin::Chưa đặt secret SH_E2E_ADMIN_USER / SH_E2E_ADMIN_PASSWORD — các kịch bản cần quản trị sẽ báo bỏ qua (skipped)."
          fi
      - name: Build and start the stack
        run: |
          docker compose build
          SH_GATEWAY_RATE=100r/s SH_GATEWAY_BURST=200 docker compose up -d
          for i in $(seq 1 120); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18000/health/ready)" = "200" ] && exit 0
            sleep 5
          done
          echo "Stack không sẵn sàng sau 10 phút"; docker compose ps; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --workers=2 --reporter=line,html
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
      - name: API logs on failure
        if: failure()
        run: docker compose logs api --tail 500 | grep -v '\[SEED\]'
