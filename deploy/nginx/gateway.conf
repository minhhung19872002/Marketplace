# ShopHub gateway: / -> web, /seller -> seller, /admin -> admin, /api + /hubs -> api
# Upstreams resolved at request time via Docker DNS (no pinned IPs)
resolver 127.0.0.11 valid=10s ipv6=off;

# Rendered from the template by the nginx image (envsubst): SH_GATEWAY_RATE / SH_GATEWAY_BURST, production 30r/s burst 60
limit_req_zone $binary_remote_addr zone=sh_api:10m rate=${SH_GATEWAY_RATE};
limit_req_status 429;

# Access log without the query string: SignalR's ?access_token= (JWT) and the signed /s3/ URLs never reach a log
# file (6.1, L129). Each server block uses it — a server-level access_log replaces the image's default http-level one.
log_format sh_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';

# Crawlers get server-rendered HTML (spec 6.6); people get the SPA
map $http_user_agent $sh_is_bot {
    default 0;
    ~*(googlebot|bingbot|yandex|baiduspider|duckduckbot|slurp|applebot|coccocbot|facebookexternalhit|twitterbot|linkedinbot|zalo|telegrambot|discordbot|whatsapp) 1;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Presigned links (private buckets: KYC, return evidence) must never sit in a cache; public objects may
map $args $sh_s3_cache {
    ~*(^|&)X-Amz-Signature=  "private, no-store";
    default                  "public, max-age=604800";
}

server {
    access_log /var/log/nginx/access.log sh_noquery;
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 50m;

    set $api_upstream    http://api:8080;
    set $web_upstream    http://web:80;
    set $seller_upstream http://seller:80;
    set $admin_upstream  http://admin:80;
    set $minio_upstream  http://minio:9000;

    include /etc/nginx/snippets/security-headers.inc;

    # Gateway is the single source of security headers — drop the upstream copies
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # JSON error pages in Vietnamese (never the default HTML 5xx page)
    error_page 429 = @too_many;
    error_page 502 503 504 = @unavailable;

    location @too_many {
        default_type application/json;
        return 429 '{"success":false,"data":null,"message":"Bạn thao tác quá nhanh, vui lòng thử lại sau giây lát.","errors":[]}';
    }

    location @unavailable {
        default_type application/json;
        return 503 '{"success":false,"data":null,"message":"Hệ thống đang bận hoặc bảo trì, vui lòng thử lại sau.","errors":[]}';
    }

    location /api/ {
        limit_req zone=sh_api burst=${SH_GATEWAY_BURST} nodelay;
        proxy_pass $api_upstream;
    }

    location /hubs/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # Any proxy_set_header here drops the server-level ones, so repeat them
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass $api_upstream;
    }

    location = /health/ready {
        proxy_pass $api_upstream;
    }

    # Stored files (public buckets, and signed URLs for private ones). Read-only through the gateway; the
    # original MinIO host is forwarded so presigned signatures stay valid.
    location /s3/ {
        limit_except GET HEAD { deny all; }
        rewrite ^/s3/(.*)$ /$1 break;
        proxy_set_header Host minio:9000;
        # Own proxy_hide_header here → the server-level ones are not inherited either: drop MinIO's copies again
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control $sh_s3_cache always;
        include /etc/nginx/snippets/security-headers.inc;
        proxy_pass $minio_upstream;
    }

    location /seller/ {
        rewrite ^/seller/(.*)$ /$1 break;
        proxy_pass $seller_upstream;
    }

    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass $admin_upstream;
    }

    location = /robots.txt {
        proxy_pass $api_upstream/api/seo/robots.txt;
    }

    location = /sitemap.xml {
        proxy_pass $api_upstream/api/seo/sitemap.xml;
    }

    location /sitemaps/ {
        rewrite ^/sitemaps/(.*)$ /api/seo/sitemaps/$1 break;
        proxy_pass $api_upstream;
    }

    location / {
        # Bots: the same URL rendered on the server (title, meta, Open Graph, JSON-LD, content); query string kept
        if ($sh_is_bot) {
            rewrite ^ /api/seo/render?path=$uri last;
        }
        proxy_pass $web_upstream;
    }
}
