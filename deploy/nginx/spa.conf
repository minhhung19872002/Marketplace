# Static SPA server used inside each frontend container (behind the gateway).
# Carries the same security baseline as the gateway (NginxConfigParityTests).
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=sh_static:10m rate=100r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws: wss:" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    limit_req zone=sh_static burst=200 nodelay;

    error_page 429 = @too_many;
    error_page 500 502 503 504 = @unavailable;

    location @too_many {
        default_type application/json;
        return 429 '{"success":false,"data":null,"message":"Bạn thao tác quá nhanh, vui lòng thử lại sau giây lát.","errors":[]}';
    }

    location @unavailable {
        default_type application/json;
        return 503 '{"success":false,"data":null,"message":"Hệ thống đang bận hoặc bảo trì, vui lòng thử lại sau.","errors":[]}';
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
